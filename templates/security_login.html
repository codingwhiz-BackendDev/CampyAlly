{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Login — CampAlly Redemption City</title>
  <meta name="description" content="Security personnel login for CampAlly operations center">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Video background */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.3;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 15, 35, 0.85) 0%, rgba(26, 26, 46, 0.9) 50%, rgba(22, 33, 62, 0.85) 100%);
      z-index: 1;
    }

    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(233, 69, 96, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(233, 69, 96, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 2;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(233, 69, 96, 0.1);
      position: relative;
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      color: white;
      box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .login-title {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      font-weight: 400;
    }

    .rccg-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(233, 69, 96, 0.15);
      border: 1px solid rgba(233, 69, 96, 0.3);
      border-radius: 20px;
      padding: 6px 14px;
      margin-top: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .rccg-badge i {
      color: #e94560;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-input {
      width: 100%;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.3s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #e94560;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.15);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-login {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 12px;
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.35);
    }

    .btn-login:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(233, 69, 96, 0.5);
    }

    .btn-login:active {
      transform: translateY(-1px);
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
      padding: 14px;
      background: rgba(233, 69, 96, 0.08);
      border-radius: 12px;
      border: 1px solid rgba(233, 69, 96, 0.2);
    }

    .security-badge i {
      color: #e94560;
      font-size: 14px;
    }

    .security-badge span {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      font-weight: 500;
    }

    .messages {
      margin-bottom: 24px;
    }

    .message {
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 36px 28px;
        border-radius: 20px;
      }

      .login-title {
        font-size: 26px;
      }

      .login-logo {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="{% static 'video/background_video.mp4' %}" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <div class="grid-overlay"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="login-title">Security Portal</h1>
      <p class="login-subtitle">CampAlly Operations Center</p>
      <div class="rccg-badge">
        <i class="fa-solid fa-church"></i>
        <span>RCCG Redemption City</span>
      </div>
    </div>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ message.tags }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          placeholder="Enter your username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket"></i> Access Dashboard
      </button>
    </form>

    <div class="security-badge">
      <i class="fa-solid fa-lock"></i>
      <span>Authorized Personnel Only</span>
    </div>
  </div>

  <script>
    // Auto-focus username field on load
    document.getElementById('username').focus();
  </script>
</body>
</html>
